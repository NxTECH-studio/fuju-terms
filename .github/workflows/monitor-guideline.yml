name: Monitor Upstream Guideline

on:
  schedule:
    # 毎日 JST 10:00 (UTC 01:00) に実行
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  GUIDELINE_URL: 'https://www.cho-kaguyahime.com/special/detail.html?id=1024'

jobs:
  check-guideline:
    name: Check Upstream Guideline Changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Fetch guideline content
        id: fetch
        run: |
          set -euo pipefail
          python3 scripts/fetch_guideline.py "$GUIDELINE_URL" > /tmp/current.txt
          NEW_HASH=$(sha256sum /tmp/current.txt | awk '{print $1}')
          OLD_HASH=$(cat .guideline-monitor/current.sha256 2>/dev/null | tr -d '\n' || true)
          echo "new_hash=$NEW_HASH" >> "$GITHUB_OUTPUT"
          echo "old_hash=$OLD_HASH" >> "$GITHUB_OUTPUT"
          if [[ -z "$OLD_HASH" ]]; then
            echo "changed=initial" >> "$GITHUB_OUTPUT"
          elif [[ "$OLD_HASH" != "$NEW_HASH" ]]; then
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "changed=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Show diff (if any)
        if: steps.fetch.outputs.changed == 'yes'
        run: |
          diff -u .guideline-monitor/current.txt /tmp/current.txt | head -200 || true

      - name: Update stored hash and content
        if: steps.fetch.outputs.changed != 'no'
        run: |
          cp /tmp/current.txt .guideline-monitor/current.txt
          echo "${{ steps.fetch.outputs.new_hash }}" > .guideline-monitor/current.sha256

      - name: Commit updated state
        if: steps.fetch.outputs.changed != 'no'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .guideline-monitor/current.txt .guideline-monitor/current.sha256
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(monitor): update upstream guideline snapshot"
            git push
          fi

      - name: Open issue on change
        if: steps.fetch.outputs.changed == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.GUIDELINE_URL;
            const oldHash = '${{ steps.fetch.outputs.old_hash }}';
            const newHash = '${{ steps.fetch.outputs.new_hash }}';
            const body = [
              '## 原作ガイドラインに変更を検知しました',
              '',
              `- ページURL: ${url}`,
              `- 旧ハッシュ: \`${oldHash}\``,
              `- 新ハッシュ: \`${newHash}\``,
              '',
              '`./.guideline-monitor/current.txt` の差分を確認し、本リポジトリの規約（`terms.md` 第2条の2、禁止事項等）に反映が必要か確認してください。',
              '',
              '### 確認チェックリスト',
              '- [ ] 変更内容が本サービスの運用方針に影響するかレビュー',
              '- [ ] 必要に応じて規約（`terms.md` `privacy.md` `auth-component.md`）を改訂',
              '- [ ] 改訂時は各ファイルの改定履歴を更新',
              '- [ ] UI・運用ガイドライン（例: 禁止語彙、モデレーション）にも反映',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[guideline] 原作ガイドラインの更新を検知 (${newHash.substring(0,12)})`,
              body,
              labels: ['guideline', 'needs-review'],
            });
